<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade Demo</title>
    <style>
        /* Box styling with border and some padding */
        .box {
            border: 2px solid #333;
            padding: 20px;
            margin-top: 20px;
            width: 200px;
            text-align: center;
            background-color: #f9f9f9;
            transition: opacity 0.5s ease;
            opacity: 1;
        }

        /* Class that fades the box out */
        .box.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <button id="toggle-btn">Toggle Fade</button>
    <div id="box" class="box">
        <p>Some random text inside the box.</p>
    </div>

    <script>
        const button = document.getElementById('toggle-btn');
        const box = document.getElementById('box');

        button.addEventListener('click', () => {
            box.classList.toggle('fade-out');
        });
    </script>
</body>
</html>
